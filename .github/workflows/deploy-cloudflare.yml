name: Deploy studio to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://arakmsikdjguhyqtqbsm.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gzvw3Zf8VhfoLV0xzIzuPA_Q07tu8cp
          SUPABASE_URL: https://arakmsikdjguhyqtqbsm.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_gzvw3Zf8VhfoLV0xzIzuPA_Q07tu8cp

      - name: Deploy to Cloudflare Workers
        run: |
          if [ -f .output/wrangler.json ]; then
            echo "Using nitro-generated wrangler config"
            cd .output && npx wrangler deploy
          elif [ -f .output/wrangler.toml ]; then
            echo "Using nitro-generated wrangler.toml"
            cd .output && npx wrangler deploy
          else
            echo "Using repo wrangler.jsonc"
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
