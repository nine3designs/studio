name: Deploy studio to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://arakmsikdjguhyqtqbsm.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_gzvw3Zf8VhfoLV0xzIzuPA_Q07tu8cp
          SUPABASE_URL: https://arakmsikdjguhyqtqbsm.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_gzvw3Zf8VhfoLV0xzIzuPA_Q07tu8cp

      - name: Deploy to Cloudflare Workers
        run: |
          if [ -f .output/server/index.mjs ]; then
            npx wrangler deploy \
              --name nine3-studio \
              --routes "studio.nine3designs.co.uk/*" \
              --var "SUPABASE_URL:https://arakmsikdjguhyqtqbsm.supabase.co" \
              --var "SUPABASE_PUBLISHABLE_KEY:sb_publishable_gzvw3Zf8VhfoLV0xzIzuPA_Q07tu8cp"
          else
            echo "::error::Expected .output/server/index.mjs not found"
            find .output -maxdepth 2 -type f 2>/dev/null | head -50
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
